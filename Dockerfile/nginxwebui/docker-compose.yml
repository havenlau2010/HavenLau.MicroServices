version: "3.2"
services:
  NginxWebUI:
    image: cym1102/nginxwebui:latest
    container_name: NginxWebUI
    volumes:
      - type: bind
        source: "/home/nginxWebUI"
        target: "/home/nginxWebUI"
    environment:
      BOOT_OPTIONS: "--server.port=6066"
    privileged: true
    network_mode: "host"
