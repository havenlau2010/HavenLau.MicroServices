version: '3.7'
 
services: 
  oracle19c:
#   image: wnameless/oracle-xe-11g-r2
#   image: truevoly/oracle-12c
#   image: registry.cn-hangzhou.aliyuncs.com/zhuyijun/oracle:19c
    image: marcocimatti/oracle12.2.0.1-se2
    container_name: oracle19c
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # IMPORT_FROM_VOLUME: true
      ORACLE_SID: orcl
      ORACLE_PDB: orclpdb
      ORACLE_PWD: Lwz3131492653
      ORACLE_EDITION: standard
      ORACLE_CHARACTERSET: AL32UTF8
    ports:
      - "10300:1521"
      - "10310:8080"
    volumes:
      - /data/oracle19c/data:/opt/oracle/oradata
      - /etc/localtime:/etc/localtime
    restart: always
    networks:
      - oracle19c
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 3G

networks:
  oracle19c:
    driver: bridge
    
volumes:
  oracle19c:
    driver: local   