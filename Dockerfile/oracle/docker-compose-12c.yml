version: '3.7'
 
services: 
  oracle12c:
#   image: wnameless/oracle-xe-11g-r2
#   image: truevoly/oracle-12c
    image: marcocimatti/oracle12.2.0.1-se2
    container_name: oracle12c
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # IMPORT_FROM_VOLUME: true
      ORACLE_SID: orcl
      ORACLE_PDB: orclpdb
      ORACLE_PWD: Lwz3131492653
      ORACLE_ALLOW_REMOTE: "true"
      ORACLE_CHARACTERSET: AL32UTF8
    ports:
      - "10300:1521"
      - "10310:8080"
    volumes:
      - ./data/oracle:/u01/app/oracle
      - /etc/localtime:/etc/localtime
    privileged: true
    restart: always
    networks:
      - oracle12c
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 3G

networks:
  oracle12c:
    driver: bridge
    
volumes:
  oracle12c:
    driver: local   